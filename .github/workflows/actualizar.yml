name: Revisar liga municipal
on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar lector PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Actualizar datos compartidos
        working-directory: bebesiktas-gratis
        env:
          APP_URL: ${{ vars.APP_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: python sync.py
